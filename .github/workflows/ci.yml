name: Synthetic showcase checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q tools tests
      - name: Run synthetic unit tests
        run: python -m unittest discover -s tests -v
      - name: Build fictional sample
        run: python tools/showcase.py demo --out build
      - name: Verify archive and manifest
        run: python tools/showcase.py verify build/demo.zip build/manifest.json
      - name: No tracked files modified
        run: git diff --exit-code
